title: Visio-Azure
description: "Free Azure Visio stencil pack: 1,764 Microsoft Azure icons for Visio with working shape search, connection points and shape data, in Metric and US units. A drop-in alternative to Microsoft's SVG-only icon downloads."
baseurl: /Visio-Azure
url: https://xeeva.github.io
lang: en-AU
show_downloads: false

author:
  name: David Summers
  url: https://github.com/xeeva

twitter:
  card: summary_large_image

# default social-preview image for every page (jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image: /Visio-Azure/images/og-preview.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# llms.txt and robots.txt must ship verbatim
include:
  - llms.txt
  - robots.txt

# directory-style URLs (/getting-started/), matching canonical links
permalink: pretty
