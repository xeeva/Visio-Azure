<!DOCTYPE html>
<html lang="en-AU">
{% include site-head.html %}
<body class="ambient-bg min-h-screen bg-surface-dim text-on-surface font-body antialiased">
  <div class="relative z-10">

{% include nav.html %}

    <div class="flex pt-16">
{% include sidebar.html %}

      <main class="mx-auto max-w-4xl flex-1 px-4 py-12 sm:px-6 lg:px-8">
        <div class="mb-10 border-b border-on-surface/5 pb-8">
          <div class="mb-3 inline-flex items-center gap-2 rounded-sm border border-primary/15 bg-primary/5 px-3 py-1">
            <span class="font-label text-[10px] uppercase tracking-widest text-primary">Documentation</span>
          </div>
          <h1 class="font-headline text-4xl font-bold tracking-tighter text-on-surface md:text-5xl">
            {{ page.title }}
          </h1>
        </div>
        <article class="docs-content-panel p-6 sm:p-8 lg:p-10">
          <div class="prose">
            {{ content }}
          </div>
        </article>
        <div class="mt-12 flex items-center justify-center gap-2 text-on-surface-variant/30">
          <div class="h-px flex-1 bg-gradient-to-r from-transparent via-on-surface/5 to-transparent"></div>
          <span class="material-symbols-outlined text-sm">hub</span>
          <div class="h-px flex-1 bg-gradient-to-r from-transparent via-on-surface/5 to-transparent"></div>
        </div>
      </main>
    </div>

{% include footer.html %}

  </div>
{% include menu-script.html %}
</body>
</html>
