name: Release

on:
  push:
    tags:
      - 'V-*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#V-}" >> "$GITHUB_OUTPUT"

      - name: Bundle release ZIP
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          src="stencils/V-${version}"
          if [ ! -d "$src" ]; then
            echo "::error::expected $src to exist for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          zip_name="Visio-Azure_V-${version}.zip"
          (cd "$src" && zip -r "../../$zip_name" .)
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
          sha256sum "$zip_name" > "$zip_name.sha256"
          ls -la "$zip_name" "$zip_name.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            stencils/V-${{ steps.ver.outputs.version }}/Azure_All-Icons_V-${{ steps.ver.outputs.version }}.vssx
            stencils/V-${{ steps.ver.outputs.version }}/Azure_Drawing-Resources_V-${{ steps.ver.outputs.version }}.vssx
          generate_release_notes: false
