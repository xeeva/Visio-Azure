name: Release

on:
  push:
    tags:
      - 'V-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checksums for the unit zips
        run: |
          set -euo pipefail
          shopt -s nullglob
          for z in Visio-Azure-Stencils-*.zip; do
            sha256sum "$z" > "$z.sha256"
          done
          ls -la Visio-Azure-Stencils-*.zip*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          files: |
            Visio-Azure-Stencils-Metric-*.zip
            Visio-Azure-Stencils-US-*.zip
            Visio-Azure-Stencils-*.zip.sha256
            M/Azure_All-Icons_*_m.vssx
            U/Azure_All-Icons_*_u.vssx
            M/Azure_Drawing-Resources_*.vssx
